<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVĐN Chatible — Công cụ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app" id="app">
      <main class="main">
        <div class="main__inner">
          <h1 class="page-title">Công cụ</h1>

          <div class="card">
            <div class="card__body">
              <b>Phiên bản chatbot:</b> <span id="version" class="muted">…</span>
            </div>
          </div>

          <div class="card">
            <div class="card__header">Kiểm tra thông tin user</div>
            <div class="card__body">
              <div class="grid grid--2">
                <div>
                  <div class="field">
                    <label for="tool-id">Check info theo ID</label>
                    <textarea class="input" id="tool-id" rows="1" placeholder="Nhập ID"></textarea>
                  </div>
                  <br />
                  <button class="btn" id="check-btn">Kiểm tra</button>
                </div>
                <div id="tool-info"></div>
              </div>
            </div>
          </div>

          <div class="grid grid--2">
            <div class="card">
              <div class="card__header">Sao lưu</div>
              <div class="card__body">
                <p class="muted">Tạo bản sao lưu trạng thái ghép cặp.</p>
                <button class="btn" id="backup-btn">Tải bản sao lưu</button>
              </div>
            </div>

            <div class="card">
              <div class="card__header">Khôi phục</div>
              <div class="card__body">
                <p class="muted">Khôi phục trạng thái ghép cặp từ file sao lưu.</p>
                <input type="file" id="fileToLoad" accept="application/json" />
                <div id="restore-status"></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card__header card__header--danger">Xoá dữ liệu</div>
            <div class="card__body">
              <p class="muted">Xoá toàn bộ dữ liệu trên server! Hành động không thể phục hồi.</p>
              <button class="btn btn--danger" id="reset-btn">Xoá dữ liệu</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/js/tools.js"></script>
  </body>
</html>
