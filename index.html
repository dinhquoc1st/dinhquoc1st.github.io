<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="login.title">SVĐN Chatible — Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div class="login">
      <div class="login__card">
        <div class="login__logo">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4-1L3 20l1.1-3.3A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z" />
          </svg>
        </div>
        <h1 class="login__title">SVĐN Chatible</h1>
        <p class="login__subtitle" data-i18n="login.subtitle">Bảng điều khiển quản trị</p>

        <form class="login__form" id="login-form">
          <div class="field">
            <label for="pwd" data-i18n="login.password">Mật khẩu</label>
            <input class="input" type="password" id="pwd" placeholder="Nhập mật khẩu" data-i18n-placeholder="login.passwordPlaceholder" autocomplete="current-password" />
          </div>
          <button class="btn btn--block" type="submit" id="login-button" data-i18n="login.submit">Đăng nhập</button>
          <div class="login__error" id="login-error"></div>
        </form>
      </div>
    </div>

    <script src="/js/crypto-js.min.js"></script>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
