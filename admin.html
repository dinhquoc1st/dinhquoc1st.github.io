<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="admin.title">SVĐN Chatible — Thông tin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app" id="app">
      <main class="main">
        <div class="main__inner">
          <h1 class="page-title" data-i18n="admin.heading">Thông tin</h1>

          <div class="card card--accent">
            <div class="card__header">
              <span data-i18n="matching.status">Trạng thái ghép cặp</span>
              <span class="muted" id="refresh-time"></span>
            </div>
            <div class="card__body">
              <div id="stats"></div>
              <div class="grid grid--2">
                <div id="waitroom"></div>
                <div id="chatroom"></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card__header" data-i18n="user.info">Thông tin user</div>
            <div class="card__body">
              <div id="userinfo"><div class="muted" data-i18n="user.select">Chọn một user để xem thông tin.</div></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
